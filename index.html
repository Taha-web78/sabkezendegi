<!DOCTYPE html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 بانک سوالات امتحان</title>
    <link
      href="https://cdn.fontcdn.ir/FontPersian/Vazir/Vazir.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="header">
      <h1>📖 بانک سوالات امتحان</h1>
      <p>دروس دهم تا بیست و یکم | جستجوی هوشمند | آماده برای مرور سریع</p>
    </div>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="جستجو کن... مثلا: ازدواج، نامزدی، پختگی، غیرت"
      />
    </div>

    <div id="lessonsContainer" class="lessons-grid"></div>

    <div class="footer">
      ✨ کلمه مورد نظر رو جستجو کن، هایلایت میشه | موفق باشی در امتحان
    </div>
  </body>
</html>
